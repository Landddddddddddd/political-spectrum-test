<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>意识形态测试 · CSV 汇总（D13）</title>
<style>
  :root{ --bg:#fff; --surface:#f5f6f8; --border:#e2e4e9; --text:#1c1d21; --muted:#6b6f76; --purple:#534AB7; --teal:#0F6E56; --blue:#2F6FB0; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;padding:24px 16px;max-width:820px;margin:0 auto;}
  h1{font-size:20px;font-weight:600;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:13px;margin:0 0 18px;}
  .card{background:var(--surface);border-radius:12px;padding:18px;margin:14px 0;}
  .note{font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin:14px 0;}
  .drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--border);border-radius:14px;padding:30px 18px;text-align:center;cursor:pointer;transition:.12s;background:#fff;}
  .drop.hot{border-color:var(--purple);background:#f3f1fe;}
  .drop b{font-size:14px;}
  .drop span{font-size:12px;color:var(--muted);}
  button{font:inherit;border:0;border-radius:10px;padding:11px 18px;cursor:pointer;}
  .primary{background:var(--purple);color:#fff;}
  .ghost{background:var(--surface);color:var(--text);border:1px solid var(--border);}
  .primary:disabled{opacity:.45;cursor:not-allowed;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:6px;}
  .stat{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 14px;}
  .stat .v{font-size:24px;font-weight:600;color:var(--purple);}
  .stat .k{font-size:12px;color:var(--muted);}
  .stat.warn .v{color:#c0392b;}
  .stat.good .v{color:var(--teal);}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px;}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-weight:500;}
  .bar{height:8px;border-radius:5px;background:var(--border);overflow:hidden;margin-top:3px;}
  .bar > i{display:block;height:100%;background:var(--purple);}
  .ok{color:var(--teal);} .err{color:#c0392b;} .muted{color:var(--muted);}
  code{background:var(--surface);padding:1px 5px;border-radius:5px;font-size:12px;}
  .hidden{display:none;}
  a.dl{color:var(--blue);text-decoration:none;font-size:13px;}
</style>
</head>
<body>
<h1>意识形态测试 · CSV 汇总工具（D13）</h1>
<p class="sub">把多人跑 <code>calibrate.html</code> 导出的多份 CSV 拖进来，自动<strong>拼接、去重、统计</strong>，导出一份干净合并 CSV。全程本地运行，不上传。</p>

<div class="note">去重规则：按 <code>session_id + question_id</code> 去重（同一会话同一题只留一行），<code>self_label</code> / <code>retake_of</code> 在同一会话内各行一致，去重后完整保留。可直接把合并结果交给我做真实精度校准。</div>

<div class="card">
  <label class="drop" id="drop" for="file">
    <b>拖入 / 点击选择多个 CSV 文件</b>
    <span>支持 .csv；可一次选多份</span>
  </label>
  <input type="file" id="file" accept=".csv,text/csv" multiple class="hidden">
  <div class="row">
    <button class="primary" id="runBtn" disabled>汇总并统计</button>
    <button class="ghost" id="clearBtn">清空</button>
    <span id="fileNames" class="muted"></span>
  </div>
  <div id="msg" class="err"></div>
</div>

<div id="result" class="hidden">
  <div class="card">
    <h1 style="font-size:16px">汇总概览</h1>
    <div class="grid" id="stats"></div>
  </div>

  <div class="card">
    <h1 style="font-size:16px">自报立场（self_label）分布</h1>
    <p class="sub" id="labelNote"></p>
    <table id="labelTbl"><thead><tr><th>立场</th><th>会话数</th><th>占比</th></tr></thead><tbody></tbody></table>
  </div>

  <div class="card">
    <h1 style="font-size:16px">题目覆盖</h1>
    <p class="sub" id="covNote"></p>
    <table id="covTbl"><thead><tr><th>指标</th><th>数值</th></tr></thead><tbody></tbody></table>
  </div>

  <div class="card">
    <h1 style="font-size:16px">导出</h1>
    <div class="row">
      <button class="primary" id="expBtn">下载合并 CSV（已去重）</button>
      <a class="dl" id="expLink" download="calib_merged.csv">若按钮无效，点此下载</a>
    </div>
  </div>
</div>

<script>
/* ---------- CSV 解析（标准引号转义，兼容 calibrate 导出） ---------- */
function parseCSV(text){
  const rows=[]; let row=[], field="", inQ=false;
  const n=text.length; let i=0;
  while(i<n){
    const c=text[i];
    if(inQ){
      if(c==='"'){
        if(text[i+1]==='"'){ field+='"'; i+=2; continue; }
        inQ=false; i++; continue;
      }
      field+=c; i++; continue;
    }
    if(c==='"'){ inQ=true; i++; continue; }
    if(c===','){ row.push(field); field=""; i++; continue; }
    if(c==='\n' || c==='\r'){ row.push(field); rows.push(row); row=[]; field=""; i++; if(c==='\r'&&text[i]==='\n') i++; continue; }
    field+=c; i++;
  }
  if(field.length>0 || row.length>0){ row.push(field); rows.push(row); }
  return rows;
}
function toCSV(rows){
  return rows.map(r=>r.map(c=>{ c=String(c==null?"":c); return /[",\n\r]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }).join(",")).join("\n");
}
const HEADER=["session_id","question_id","chosen_option","self_label","retake_of"];

let FILES=[], DEDUP=[], MERGED=null;

const $ = id=>document.getElementById(id);
const drop=$("drop"), fileInput=$("file");

drop.addEventListener("dragover",e=>{e.preventDefault();drop.classList.add("hot");});
drop.addEventListener("dragleave",()=>drop.classList.remove("hot"));
drop.addEventListener("drop",e=>{e.preventDefault();drop.classList.remove("hot");addFiles(e.dataTransfer.files);});
fileInput.addEventListener("change",e=>addFiles(e.target.files));

function addFiles(list){
  const arr=[...list].filter(f=>/\.csv$/i.test(f.name));
  if(!arr.length){ $("msg").textContent="没有识别到 .csv 文件。"; return; }
  FILES=[...FILES,...arr];
  $("msg").textContent="";
  $("fileNames").textContent="已选 "+FILES.length+" 个文件："+FILES.map(f=>f.name).join("、");
  $("runBtn").disabled=false;
}
$("clearBtn").addEventListener("click",()=>{
  FILES=[]; DEDUP=[]; MERGED=null;
  fileInput.value=""; $("fileNames").textContent=""; $("runBtn").disabled=true;
  $("result").classList.add("hidden"); $("msg").textContent="";
});

$("runBtn").addEventListener("click",async ()=>{
  try{
    const texts=await Promise.all(FILES.map(f=>f.text()));
    const allRows=[];
    let badHeader=0;
    texts.forEach(t=>{
      const rows=parseCSV(t);
      if(!rows.length) return;
      // 首行若为表头则跳过
      const head=rows[0].map(x=>x.trim().toLowerCase());
      const isHeader=HEADER.every((h,k)=>head[k]===h);
      const start=isHeader?1:0;
      if(!isHeader) badHeader++;
      for(let k=start;k<rows.length;k++){
        const r=rows[k];
        if(r.length<5) r.length=5, r[4]=r[4]||""; // 容错补齐
        allRows.push(r);
      }
    });
    if(!allRows.length){ $("msg").textContent="所有文件都没有可用数据行。"; return; }

    // 去重
    const seen=new Set(); const dedup=[]; let dup=0;
    allRows.forEach(r=>{
      const key=(r[0]||"")+"|"+(r[1]||"");
      if(seen.has(key)){ dup++; return; }
      seen.add(key); dedup.push(r);
    });

    // 聚合
    const sessions={}; // sid -> {label, retake, qids:Set}
    dedup.forEach(r=>{
      const sid=r[0]||"", qid=r[1]||"", label=(r[3]||"").trim(), retake=(r[4]||"").trim();
      if(!sessions[sid]) sessions[sid]={label:"",retake:"",qids:new Set()};
      if(label) sessions[sid].label=label;
      if(retake) sessions[sid].retake=retake;
      sessions[sid].qids.add(qid);
    });
    const sids=Object.keys(sessions);
    const sWithLabel=sids.filter(s=>sessions[s].label);
    const sRetake=sids.filter(s=>sessions[s].retake);

    // 立场分布
    const labelCount={};
    sWithLabel.forEach(s=>{ const l=sessions[s].label; labelCount[l]=(labelCount[l]||0)+1; });
    const labelArr=Object.entries(labelCount).sort((a,b)=>b[1]-a[1]);

    // 题目覆盖
    const qCount={};
    dedup.forEach(r=>{ const q=r[1]||""; qCount[q]=(qCount[q]||0)+1; });
    const qCovered=Object.keys(qCount).length;
    const maxQ=Math.max(...Object.values(qCount));

    // 统计卡片
    const pct=(a,b)=> b? Math.round(a/b*1000)/10+"%" : "—";
    const stats=[
      {k:"导入文件数", v:FILES.length},
      {k:"原始数据行", v:allRows.length},
      {k:"合并后(去重)", v:dedup.length, cls:""},
      {k:"重复行", v:dup, cls:dup?"warn":""},
      {k:"唯一会话数", v:sids.length, cls:"good"},
      {k:"带 self_label 的会话", v:sWithLabel.length, cls:sWithLabel.length?"good":"warn"},
      {k:"重测会话(retake)", v:sRetake.length},
      {k:"表头异常文件", v:badHeader, cls:badHeader?"warn":""},
    ];
    $("stats").innerHTML=stats.map(s=>`<div class="stat ${s.cls||''}"><div class="v">${s.v}</div><div class="k">${s.k}</div></div>`).join("");

    // 立场表
    $("labelNote").textContent = sWithLabel.length
      ? `共 ${sWithLabel.length}/${sids.length} 个会话提供了自报立场，可用于真实校准。`
      : "尚无会话提供 self_label，校准将无法进行——请让受试者结束前填写立场。";
    if(labelArr.length){
      const max=labelArr[0][1];
      $("labelTbl").querySelector("tbody").innerHTML=labelArr.map(([l,c])=>
        `<tr><td>${escapeHtml(l)}</td><td>${c}</td><td><div class="bar"><i style="width:${Math.round(c/max*100)}%"></i></div><span class="muted">${pct(c,sWithLabel.length)}</span></td></tr>`
      ).join("");
    } else {
      $("labelTbl").querySelector("tbody").innerHTML=`<tr><td colspan="3" class="muted">无数据</td></tr>`;
    }

    // 覆盖表
    $("covNote").textContent=`题目被答人次：共 ${Object.values(qCount).reduce((a,b)=>a+b,0)} 次；覆盖 ${qCovered} 个不同题号；单题最多被答 ${maxQ} 次。`;
    $("covTbl").querySelector("tbody").innerHTML=[
      ["数据行(去重后)", dedup.length],
      ["唯一会话数", sids.length],
      ["带立场会话数", sWithLabel.length],
      ["覆盖题号数", qCovered],
      ["单题最高被答次数", maxQ],
      ["重测会话数", sRetake.length],
    ].map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join("");

    // 导出数据（保留表头）
    MERGED=[HEADER,...dedup];
    $("result").classList.remove("hidden");
    $("msg").textContent="";
  }catch(e){
    $("msg").textContent="处理出错："+(e&&e.message?e.message:e);
  }
});

function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

$("expBtn").addEventListener("click",()=>{
  if(!MERGED) return;
  const csv="\ufeff"+toCSV(MERGED); // BOM 保证 Excel 中文不乱码
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=$("expLink"); a.href=url; a.download="calib_merged.csv";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
});
</script>
</body>
</html>
